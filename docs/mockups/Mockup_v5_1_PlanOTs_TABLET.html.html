<!-- Plan-OTs v5.1 TABLET - Basado en Mockup_v5 -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan-OTs · v4 — Vidrio sobre obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════ TOKENS ══════════ */
:root{
  /* acentos — regla de OPUESTOS: lima puro (H120) + su complementario exacto a 180° */
  --lime:#00FF00; --lime-dim:#00CC00;   /* H120 S100 L50 — el lima de la muestra, sin diluir */
  --spring:#00FFB0;
  --violet:#4D2BFF;
  --rose:#FF00FF;                        /* H300 S100 L50 — opuesto EXACTO de --lime, 180° en la rueda */
  /* interactivo de marca (linaje engineering blue) */
  --blue:#2962FF; --blue-lit:#5B8CFF;
  /* semántica de estado — NO cambia, es memoria del usuario */
  --s-pend:#FF4757; --s-proc:#2962FF; --s-cerr:#00FF00; --s-na:#6B7A90;

  /* superficie VIDRIO (default) */
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.075);
  --hair:rgba(255,255,255,.11);
  --hair-2:rgba(255,255,255,.18);
  --ink:#F2F6FA;
  --body:rgba(242,246,250,.66);
  --mute:rgba(242,246,250,.40);
  --scrim:rgba(6,10,18,.62);
  --blurAmt:22px;

  /* escala — densa, controlada */
  --fs:13px; --fs-sm:12px; --fs-lb:9.5px;
  --pad:18px; --gap:14px; --touch:38px; --r:14px; --r-sm:9px;
  --side:220px; --pin:18px; --hit:38px;
}
body.tablet{ --fs:14px; --fs-sm:13px; --fs-lb:10px; --pad:20px; --gap:16px; --touch:48px; --side:64px; --pin:22px; --hit:48px; }
body.field{
  --panel:#FFFFFF; --panel-2:#F4F7FB; --hair:#DEE5EE; --hair-2:#C6D2E0;
  --ink:#0C1420; --body:#41536B; --mute:#8496AC; --scrim:rgba(230,237,246,.99); --blurAmt:0px;
  --lime:#188A18; --lime-dim:#127012; --s-cerr:#188A18;
}
.bg-crit{background:rgba(255,0,255,.15);color:var(--rose)}
body.field .bg-crit{background:#FCE0FA;color:#B300A8}
.kpis4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:var(--gap)}
body.tablet .kpis4{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.kpis4{grid-template-columns:repeat(2,1fr)}}
.stat .n{font-size:23px;font-weight:300;letter-spacing:-.03em;line-height:1}
.stat .n b{font-weight:600}
.stat .l{font-size:10px;color:var(--mute);display:flex;align-items:center;gap:5px;margin-top:5px;line-height:1.3}
.kcard{cursor:default}
.kcard .p-h{display:flex;align-items:center;gap:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;font-size:var(--fs);color:var(--ink);overflow:hidden;background:#070B12;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
::placeholder{color:var(--mute)}
.mono{font-family:'DM Mono',monospace;letter-spacing:0}
.lb{font-size:var(--fs-lb);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:99px}

/* ══════════ FONDO DE OBRA ══════════ */
#bg{position:fixed;inset:0;z-index:0;background-color:#070B12;background-size:cover;background-position:center 38%;
  filter:blur(3px) saturate(.86) brightness(.95);transition:filter .35s}
#bgScrim{position:fixed;inset:0;z-index:1;background:
  radial-gradient(120% 80% at 78% 6%, rgba(0,255,0,.055), transparent 55%),
  radial-gradient(90% 70% at 6% 94%, rgba(41,98,255,.15), transparent 60%),
  linear-gradient(180deg, rgba(6,10,18,.60), rgba(6,10,18,.87));
  transition:background .35s}
body.field #bg{filter:grayscale(.4) brightness(1.14) saturate(.7)}
body.field #bgScrim{background:linear-gradient(180deg,rgba(232,239,247,.975),rgba(226,234,244,.992))}

/* ══════════ BANNER ══════════ */
#banner{position:relative;z-index:400;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:7px 16px;background:rgba(4,7,12,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.07);font-size:11.5px;color:rgba(255,255,255,.55)}
#banner b{color:var(--lime);font-weight:700;letter-spacing:.1em;font-size:10.5px}
#banner .sep{width:1px;height:14px;background:rgba(255,255,255,.14)}
#banner select{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.14);padding:4px 8px;border-radius:7px;font-size:11.5px;font-weight:500}
#banner select option{color:#0B1929}
.tg{padding:4px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.55);font-size:11.5px;font-weight:600;transition:.15s}
.tg.on{background:var(--lime);border-color:var(--lime);color:#0A0E06}

/* ══════════ SHELL ══════════ */
#shell{position:relative;z-index:10;display:flex;height:calc(100% - 34px)}
aside{width:var(--side);flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px;gap:5px;
  border-right:1px solid var(--hair);background:var(--panel);backdrop-filter:blur(var(--blurAmt))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand .m{width:30px;height:30px;border-radius:9px;background:var(--lime);color:#0A0E06;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.brand .t{font-weight:600;font-size:14px;letter-spacing:-.02em;white-space:nowrap}
.brand .t i{font-style:normal;color:var(--lime)}
body.tablet .brand .t{display:none}
.nsec{padding:14px 10px 5px}
body.tablet .nsec{display:none}
.ni{display:flex;align-items:center;gap:11px;height:var(--touch);padding:0 10px;border-radius:var(--r-sm);
  color:var(--body);font-size:var(--fs-sm);font-weight:500;transition:.16s;width:100%;text-align:left;position:relative}
.ni svg{width:17px;height:17px;flex-shrink:0;stroke-width:1.5}
.ni:hover{background:var(--panel-2);color:var(--ink)}
.ni.on{background:var(--panel-2);color:var(--ink)}
.ni.on::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:2px;height:16px;background:var(--lime);border-radius:0 2px 2px 0}
.ni.dim{opacity:.42}
body.tablet .ni{justify-content:center;padding:0}
body.tablet .ni span{display:none}
.me{margin-top:auto;display:flex;align-items:center;gap:9px;padding:12px 8px 2px;border-top:1px solid var(--hair)}
.av{border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:600;color:#080C14;flex-shrink:0}
.me .n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .r{font-size:10.5px;color:var(--mute)}
body.tablet .me .info{display:none}

main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header#top{height:56px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 22px;
  border-bottom:1px solid var(--hair);background:var(--panel);backdrop-filter:blur(var(--blurAmt));z-index:40}
#vTitle{font-size:15px;font-weight:600;letter-spacing:-.02em}
.psel{position:relative}
.pbtn{display:flex;align-items:center;gap:9px;height:var(--touch);padding:0 12px;border-radius:var(--r-sm);
  border:1px solid var(--hair);background:var(--panel);font-size:var(--fs-sm);font-weight:500;transition:.16s}
.pbtn:hover{border-color:var(--hair-2)}
.pbtn .sw{width:20px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid var(--hair)}
.pmenu{position:absolute;top:calc(100% + 7px);left:0;min-width:270px;padding:6px;border-radius:var(--r);
  border:1px solid var(--hair-2);background:rgba(14,20,30,.96);backdrop-filter:blur(20px);box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;z-index:120}
body.field .pmenu{background:#fff;box-shadow:0 20px 50px rgba(15,30,55,.16)}
.pmenu.on{display:block}
.pmi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-sm);text-align:left;transition:.12s}
.pmi:hover{background:var(--panel-2)}
.pmi .sw{width:34px;height:24px;border-radius:5px;border:1px solid var(--hair);flex-shrink:0}
.pmi .n{font-size:12.5px;font-weight:600}
.pmi .c{font-size:10.5px;color:var(--mute)}
.tr{margin-left:auto;display:flex;align-items:center;gap:9px}
.pill{display:flex;align-items:center;gap:7px;height:var(--touch);padding:0 13px;border-radius:99px;
  border:1px solid var(--hair);font-size:11.5px;font-weight:600;background:var(--panel)}
.pill .d{width:6px;height:6px;border-radius:99px}
.pill.on-line .d{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.pill.sync .d{background:#FFB800;animation:bl 1s infinite}
.pill.off .d{background:var(--mute)}
.pill .q{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--mute)}
@keyframes bl{50%{opacity:.3}}
.ib{width:var(--touch);height:var(--touch);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--body);position:relative;transition:.15s}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.ib svg{width:17px;height:17px;stroke-width:1.5}
.ib .dt{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:99px;background:var(--rose)}

#root{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.wrap{padding:20px 22px 44px;max-width:1360px;animation:up .4s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}

/* ══════════ PANEL DE VIDRIO ══════════ */
.p{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);backdrop-filter:blur(var(--blurAmt));position:relative;overflow:hidden}
.p::after{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);pointer-events:none}
body.field .p::after{display:none}
body.field .p{box-shadow:0 1px 3px rgba(15,30,55,.05),0 6px 20px rgba(15,30,55,.045)}
.p-h{display:flex;align-items:center;gap:10px;padding:var(--pad) var(--pad) 0}
.p-h .lb{flex:1}
.p-b{padding:14px var(--pad) var(--pad)}
.lnk{font-size:11px;font-weight:600;color:var(--lime);cursor:pointer;letter-spacing:.02em}
body.field .lnk{color:var(--blue)}

/* ══════════ BOTONES / CHIPS ══════════ */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--touch);padding:0 15px;
  border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:600;border:1px solid transparent;transition:.16s;white-space:nowrap}
.b svg{width:15px;height:15px;stroke-width:1.8}
.b-p{background:var(--lime);color:#0A0E06}
.b-p:hover{filter:brightness(1.08);box-shadow:0 0 22px rgba(204,255,0,.28)}
.b-g{border-color:var(--hair-2);color:var(--body);background:var(--panel)}
.b-g:hover{color:var(--ink);border-color:var(--ink)}
.b.off{background:var(--panel-2);color:var(--mute);cursor:not-allowed;box-shadow:none;filter:none}
.ch{display:inline-flex;align-items:center;gap:6px;height:var(--touch);padding:0 13px;border-radius:99px;
  border:1px solid var(--hair);font-size:var(--fs-sm);font-weight:500;color:var(--body);transition:.15s;background:var(--panel)}
.ch:hover{border-color:var(--hair-2);color:var(--ink)}
.ch.on{background:var(--ink);border-color:var(--ink);color:#080C14}
.ch .n{font-family:'DM Mono',monospace;font-size:10.5px;opacity:.6}
.bg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.g-pend{background:rgba(255,71,87,.14);color:#FF7A85} .g-proc{background:rgba(41,98,255,.18);color:var(--blue-lit)}
.g-cerr{background:rgba(204,255,0,.14);color:var(--lime)} .g-na{background:rgba(255,255,255,.07);color:var(--mute)}
.g-alta{background:rgba(255,43,128,.14);color:#FF6FA5} .g-media{background:rgba(255,184,0,.14);color:#FFCB4D} .g-baja{background:rgba(255,255,255,.07);color:var(--mute)}
body.field .g-pend{background:#FFE9EB;color:#C42430} body.field .g-proc{background:#E7EEFF;color:#1E4FD8}
body.field .g-cerr{background:#EDF7CC;color:#5A7F00} body.field .g-na{background:#EDF1F6;color:#5D6E85}
body.field .g-alta{background:#FFE6F0;color:#C4185C} body.field .g-media{background:#FFF3D9;color:#96660A} body.field .g-baja{background:#EDF1F6;color:#5D6E85}
.dt{width:7px;height:7px;border-radius:99px;display:inline-block;flex-shrink:0}
.d-pend{background:var(--s-pend)} .d-proc{background:var(--s-proc)} .d-cerr{background:var(--s-cerr)} .d-na{background:var(--s-na)}
.in,.se{width:100%;height:var(--touch);padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--hair);
  background:var(--panel-2);color:var(--ink);font-size:var(--fs-sm);transition:.15s}
textarea.in{height:auto;min-height:70px;padding:10px 12px;resize:vertical;line-height:1.55}
.in:focus,.se:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(204,255,0,.13)}
.in:disabled,.se:disabled,textarea.in:disabled{opacity:.55;cursor:not-allowed}
.se option{background:#0E1420;color:#F2F6FA}
body.field .se option{background:#fff;color:#0C1420}
.fl{display:block;font-size:var(--fs-lb);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}

/* ══════════ DASHBOARD — retícula tipo panel de control ══════════ */
.hero{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hero h1{font-size:23px;font-weight:300;letter-spacing:-.03em;line-height:1.15}
.hero h1 b{font-weight:600}
.hero .sub{font-size:11.5px;color:var(--mute);margin-top:5px;letter-spacing:.02em}
.hero .spacer{flex:1}
.grid-top{display:grid;grid-template-columns:1.05fr 1fr 1.25fr;gap:var(--gap);margin-bottom:var(--gap)}
.grid-bot{display:grid;grid-template-columns:1fr 1.25fr 1.05fr;gap:var(--gap)}
body.tablet .grid-top,body.tablet .grid-bot{grid-template-columns:1fr 1fr}
@media(max-width:1080px){.grid-top,.grid-bot{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.grid-top,.grid-bot{grid-template-columns:1fr}}
.p.st{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.grid-top .p:nth-child(1){animation-delay:.02s}.grid-top .p:nth-child(2){animation-delay:.09s}.grid-top .p:nth-child(3){animation-delay:.16s}
.grid-bot .p:nth-child(1){animation-delay:.23s}.grid-bot .p:nth-child(2){animation-delay:.30s}.grid-bot .p:nth-child(3){animation-delay:.37s}

/* estructura / org */
.org{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0 2px}
.org .node{border:1px solid var(--hair-2);border-radius:7px;padding:6px 13px;font-size:11px;font-weight:500;background:var(--panel-2);white-space:nowrap}
.org .node.hi{border-color:var(--lime);color:var(--lime)}
.org .v{width:1px;height:13px;background:var(--hair-2)}
.org .row{display:flex;gap:9px;align-items:flex-start;position:relative}
.org .row::before{content:'';position:absolute;top:-13px;left:12%;right:12%;height:1px;background:var(--hair-2)}
.org .col{display:flex;flex-direction:column;align-items:center}
/* trazabilidad */
.trz{display:flex;flex-direction:column;gap:1px}
.trz .r{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--hair)}
.trz .r:last-child{border-bottom:none}
.trz .ic{width:26px;height:26px;border-radius:7px;border:1px solid var(--hair-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--body)}
.trz .ic svg{width:14px;height:14px;stroke-width:1.4}
.trz .t{flex:1;font-size:12px;font-weight:500}
.trz .v{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink)}
/* evidencia */
.evscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:16px;scrollbar-width:none}
.evscroll::-webkit-scrollbar{display:none}
.evpage{flex:0 0 100%;scroll-snap-align:start}
.ev{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ev div{aspect-ratio:4/3;border-radius:8px;background-size:cover;background-position:center;cursor:zoom-in;position:relative;border:1px solid var(--hair);transition:.18s}
.ev div:hover{transform:scale(1.04);border-color:var(--lime)}
.ev div span{position:absolute;left:5px;bottom:5px;font-size:8px;font-weight:700;letter-spacing:.1em;background:rgba(6,10,18,.72);padding:2px 5px;border-radius:4px;color:#fff}
/* indicadores */
.kpi-w{display:flex;gap:18px;align-items:center}
.donut{position:relative;flex-shrink:0}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-size:20px;font-weight:300;letter-spacing:-.03em}
.donut .c i{font-style:normal;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:1px}
.bars{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.bar .t{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;color:var(--body)}
.bar .t b{font-family:'DM Mono',monospace;font-weight:400;color:var(--ink)}
.bar .tr{height:3px;background:var(--hair);border-radius:99px;overflow:hidden;margin:0}
.bar .tr i{display:block;height:100%;border-radius:99px}
/* tabla */
.tb{width:100%;border-collapse:collapse}
.tb th{text-align:left;font-size:var(--fs-lb);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 8px 9px;border-bottom:1px solid var(--hair)}
.tb td{padding:9px 8px;border-bottom:1px solid var(--hair);font-size:11.5px;color:var(--body)}
.tb tr:last-child td{border-bottom:none}
.tb tr{cursor:pointer;transition:.12s}
.tb tbody tr:hover{background:var(--panel-2)}
.tb td b{color:var(--ink);font-weight:500}
/* flujo */
.flow{display:flex;align-items:center;justify-content:space-between;gap:5px}
.flow .st{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.flow .ic{width:38px;height:38px;border-radius:11px;border:1px solid var(--hair-2);display:flex;align-items:center;justify-content:center;position:relative;transition:.18s}
.flow .ic svg{width:17px;height:17px;stroke-width:1.3}
.flow .ic .n{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:99px;font-family:'DM Mono',monospace;font-size:9.5px;display:flex;align-items:center;justify-content:center;color:#080C14;font-weight:500;padding:0 4px}
.flow .t{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center}
.flow .ar{color:var(--hair-2);font-size:13px;padding-bottom:16px}

/* ══════════ PROYECTOS ══════════ */
.pj{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:var(--gap)}
.pjc{overflow:hidden;transition:.22s;cursor:pointer}
.pjc:hover{transform:translateY(-3px);border-color:var(--hair-2)}
.pjt{height:104px;position:relative;overflow:hidden;background:linear-gradient(150deg,rgba(41,98,255,.18),rgba(204,255,0,.06))}
.pjt .gd{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 20px),repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 20px)}
.pjt .rm{position:absolute;border:1px solid rgba(255,255,255,.22);border-radius:2px}
body.field .pjt{background:linear-gradient(150deg,#E4ECFF,#F3F9DC)}

  <div class="dtabs">${['datos|Datos','fotos|Fotos','informes|Informes','historial|Historial','firma|Firma'].map(t=>{const[k,l]=t.split('|');
   return `<button class="dtab ${tab===k?'on':''}" data-tab="${k}">${l}${k==='fotos'&&!fOK(o)?' <span style="color:#FF6FA5">•</span>':''}</button>`}).join('')}</div>`;
 B.innerHTML=({datos:tDatos,fotos:tFotos,informes:tInf,historial:tHist,firma:tFirma})[tab](o,ed);
 const fl=falt(o),ok=!fl.length;
 F.innerHTML=ed?`<div class="sv ok" id="sv"><span class="d"></span><span id="svt">Guardado automático activo</span></div>

function tDatos(o,ed){const d=ed?'':'disabled';
 return `<div class="fg">

function tFotos(o,ed){const r=REQ[o.est];
 const S=(k,l)=>{const rq=!!r[k],h=o.fotos[k].length>0,cl=h?'ok':rq?'nd':'of',st=h?['ok','✓ '+o.fotos[k].length]:rq?['nd','FALTA']:['of','—'];

 return `<div style="font-size:11.5px;color:var(--mute);margin-bottom:12px">Fotos obligatorias según estado. Tocá una miniatura para ampliar.</div>

 `<div class="inf"><span class="ic">${x[0]}</span><div class="bd"><div class="n">${x[1]}</div><div class="d">${x[2]}</div></div><button class="b b-g" style="height:32px;padding:0 13px;font-size:11px" data-toast="Informes — mantiene el motor actual (reportService)">Generar</button></div>`).join('');
const tHist=o=>{const h=o.hist.length?o.hist:[{t:'—',u:'—',a:'Sin movimientos registrados'}];
 return `<div class="tl">${h.map(i=>`<div class="tli"><div class="a">${i.a}</div><div class="m">${i.u} · ${i.t}</div></div>`).join('')}</div>`};
const tFirma=(o,ed)=>`<div style="font-size:11.5px;color:var(--mute);margin-bottom:12px">Firma del técnico o supervisor — registro interno, compatible con S Pen.</div>
 <div id="sw"><canvas id="sig"></canvas>${ed?'':'<div class="slock">Disponible para roles con edición</div>'}</div>
 ${ed?`<button class="b b-g" id="sclr" style="margin-top:9px">Limpiar</button>`:''}`;
function iSig(ed){const cv=$('#sig');if(!cv)return;const r=cv.parentElement.getBoundingClientRect();
 cv.width=r.width*2;cv.height=280;cv.style.height='140px';const x=cv.getContext('2d');x.scale(2,2);
 x.lineWidth=1.9;x.lineCap='round';x.strokeStyle=document.body.classList.contains('field')?'#0C1420':'#F2F6FA';
 if(!ed)return;let dr=false;const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dr=true;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!dr)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke()};
 cv.onpointerup=()=>{if(dr)dirty();dr=false};

function wStage(){const s=$('#stage');if(!s)return;let pd=null,mv=false;
 s.addEventListener('pointerdown',e=>{if(e.target.closest('.sh'))return;pd={x:e.clientX,y:e.clientY,tx,ty};mv=false;s.setPointerCapture(e.pointerId)});
 s.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(Math.abs(dx)+Math.abs(dy)>6)mv=true;if(mv){tx=pd.tx+dx;ty=pd.ty+dy;aT()}});
 s.addEventListener('pointerup',e=>{if(!pd)return;const w=mv;pd=null;
  const p=e.target.closest('.pin');
  if(p&&!w){openOT(P().ots.find(x=>x.id==p.dataset.pin));return}

 s.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(2.4,Math.max(.35,sc+(e.deltaY<0?.1:-.1)));aT()},{passive:false});

 if(t.closest('#cb')&&sel){const i=$('#ci');if(!i.value.trim())return;sel.cmts.push({a:'guarani3d',t:i.value.trim(),h:'ahora'});rAny();toast('Comentario agregado');return}

 if(e.target.id==='qs'){qs=e.target.value;rItems()}});
