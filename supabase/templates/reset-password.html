<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:32px 16px;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a">
  <div style="max-width:560px;margin:auto;background:#fff;border:1px solid #dbe2eb;border-radius:12px;overflow:hidden">
    <div style="background:#0b1929;padding:22px 28px;color:#fff;font-size:22px;font-weight:700">Plan-OTs</div>
    <div style="padding:28px">
      <h1 style="font-size:24px;line-height:1.3;margin:0 0 14px">Elegí una nueva contraseña</h1>
      <p style="font-size:16px;line-height:1.6">Recibimos una solicitud para crear o recuperar la contraseña de tu cuenta de Plan-OTs.</p>
      <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3b599b;color:#fff;text-decoration:none;padding:14px 22px;border-radius:8px;font-size:16px;font-weight:700">Elegir contraseña</a></p>
      <p style="font-size:14px;line-height:1.6;color:#475569">Si no pediste este cambio, ignorá el correo. Tu contraseña actual seguirá funcionando.</p>
    </div>
  </div>
