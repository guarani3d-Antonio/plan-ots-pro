<!doctype html><html lang="es"><head><meta charset="utf-8"><title>QA dashboards · tamaños reales</title><style>body{font:13px system-ui;background:#dde4ed;margin:0;padding:10px}header{display:flex;align-items:center;gap:10px;margin-bottom:8px}iframe{display:block;border:1px solid #bac6d4;height:900px;background:white;max-width:100%}pre{white-space:pre-wrap;font-size:11px}</style></head><body><header><b>Ensayo responsive · iframe con viewport real</b><button data-width="1024">Notebook 1024</button><button data-width="768">Tablet 768</button><button data-width="320">Celular 320</button></header><pre id="result">Cargando…</pre><iframe title="Dashboard de prueba responsive" src="/scripts/qa-dashboards.html" width="1024"></iframe><script>
const frame=document.querySelector('iframe'),output=document.querySelector('#result');
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;});
frame.onload=()=>{const doc=frame.contentDocument;let pending=false;
 const check=()=>{pending=false;const cards=[...doc.querySelectorAll('article')].map(el=>({title:el.querySelector('h2')?.textContent,rect:el.getBoundingClientRect()}));const overlaps=[];for(let i=0;i<cards.length;i++)for(let j=i+1;j<cards.length;j++){const a=cards[i].rect,b=cards[j].rect;if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>1&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>1)overlaps.push([cards[i].title,cards[j].title]);}output.textContent=JSON.stringify({width:frame.contentWindow.innerWidth,documentWidth:doc.documentElement.scrollWidth,cards:cards.length,overlaps,dialog:doc.querySelector('dialog[open]')?.getBoundingClientRect().width??null});};
 const schedule=()=>{if(!pending){pending=true;requestAnimationFrame(check);}};new MutationObserver(schedule).observe(doc.body,{childList:true,subtree:true,attributes:true});new ResizeObserver(schedule).observe(doc.documentElement);schedule();};
</script></body></html>
